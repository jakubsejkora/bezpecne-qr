# XcodeGen spec — the single definition of the Xcode project.
# Regenerate with:  cd ios && mint run xcodegen generate
# The generated BezpecneQR.xcodeproj and Info.plist files are not committed.
name: BezpecneQR

options:
  bundleIdPrefix: cz.bezpecneqr
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: cs
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  DesignReview: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
  DesignReview: Config/DesignReview.xcconfig

# Local Swift packages (each also builds and tests on its own).
packages:
  BQCore:
    path: Packages/BQCore
  BQServices:
    path: Packages/BQServices
  BQUI:
    path: Packages/BQUI

settings:
  base:
    # scripts/bump-version.sh keeps MARKETING_VERSION in sync with /VERSION.
    MARKETING_VERSION: "0.0.10"
    # scripts/testflight.sh passes the real build number from ios/BUILD_NUMBER.
    CURRENT_PROJECT_VERSION: 1

targets:
  BezpecneQR:
    type: application
    platform: iOS
    sources:
      - path: SharedUI
      - path: BezpecneQR
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.bezpecneqr.app
        # Hotspot Configuration (join Wi‑Fi from a code) + App Group shared with the share extension.
        CODE_SIGN_ENTITLEMENTS: BezpecneQR/BezpecneQR.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: BezpecneQR/Info.plist
      properties:
        CFBundleDisplayName: Bezpečné QR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Only OS-provided TLS and signature verification are used.
        ITSAppUsesNonExemptEncryption: false
        # Czech base texts; translations in Resources/*.lproj/InfoPlist.strings.
        NSCameraUsageDescription: Kameru používáme jen ke čtení QR kódů. Fotky neukládáme.
        NSPhotoLibraryAddUsageDescription: Platební QR kód uložíme do Fotek, aby ho šlo načíst v bankovní aplikaci.
        NSContactsUsageDescription: Kontakt z QR kódu uložíme do Kontaktů, jen když o to požádáte.
        NSCalendarsWriteOnlyAccessUsageDescription: Událost z QR kódu přidáme do Kalendáře, jen když o to požádáte.
    dependencies:
      - target: ShareExtension
        embed: true
      - package: BQCore
      - package: BQServices
      - package: BQUI
    postBuildScripts:
      # Internal comparison builds replay the corpus. Normal Release never contains it.
      - name: Embed test corpus (internal review only)
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../shared/testdata/samples.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/samples.json
        script: |
          if [ "$CONFIGURATION" = "Debug" ] || [ "$CONFIGURATION" = "DesignReview" ]; then
            cp "$SRCROOT/../shared/testdata/samples.json" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/samples.json"
          else
            rm -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/samples.json"
          fi

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SharedUI
      - path: ShareExtension
        excludes: ["Info.plist"]
    dependencies:
      - package: BQCore
      - package: BQServices
      - package: BQUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.bezpecneqr.app.share
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Bezpečné QR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: cs
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1

  BezpecneQRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BezpecneQRTests
      - path: ShareExtension/ShareViewController.swift
    dependencies:
      - target: BezpecneQR
      - package: BQCore
      - package: BQServices
      - package: BQUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cz.bezpecneqr.tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BQ_HOST_TESTS

  BezpecneQRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BezpecneQRUITests]
    dependencies:
      - target: BezpecneQR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: cz.bezpecneqr.uitests
        TEST_TARGET_NAME: BezpecneQR

schemes:
  BezpecneQR:
    build:
      targets:
        BezpecneQR: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [BezpecneQRTests]
    archive:
      config: Release

  BezpecneQRUIReview:
    build:
      targets:
        BezpecneQR: all
    test:
      config: Debug
      targets: [BezpecneQRUITests]
